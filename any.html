<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PNG → SVG</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f11; --surface: #1a1a1f; --border: #2a2a32;
    --accent: #7c6ef7; --accent2: #a78bfa; --text: #e8e6f0;
    --muted: #6b6880; --success: #34d399; --danger: #f87171;
  }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 32px 16px; gap: 20px;
  }
  header { text-align: center; }
  header h1 {
    font-size: 1.7rem; font-weight: 700;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  header p { color: var(--muted); font-size: 0.82rem; margin-top: 5px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 22px; width: 100%; max-width: 660px;
  }
  .dropzone {
    border: 2px dashed var(--border); border-radius: 10px;
    padding: 40px 20px; text-align: center; cursor: pointer;
    transition: border-color .2s, background .2s; position: relative;
  }
  .dropzone:hover, .dropzone.over { border-color: var(--accent); background: rgba(124,110,247,.05); }
  .dropzone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .dropzone p { color: var(--muted); font-size: .88rem; }
  .dropzone strong { color: var(--text); }
  .lbl {
    font-size: .72rem; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); display: block; margin-bottom: 5px;
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
  @media(max-width:480px){ .grid2 { grid-template-columns: 1fr; } }
  .row { display: flex; align-items: center; gap: 9px; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; flex: 1;
    height: 4px; border-radius: 2px; background: var(--border); cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 15px; height: 15px;
    border-radius: 50%; background: var(--accent); cursor: pointer;
  }
  .val { font-size: .78rem; color: var(--accent2); min-width: 34px; text-align: right; font-family: monospace; }
  .color-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 4px; }
  .cpick {
    display: flex; align-items: center; gap: 7px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 7px; padding: 5px 9px;
  }
  .cpick input[type=color] { width: 26px; height: 26px; border: none; background: none; cursor: pointer; padding: 0; }
  .cpick span { font-size: .82rem; font-family: monospace; color: var(--text); }
  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 12px; margin-top: 4px;
  }
  .toggle-row > label { font-size: .86rem; color: var(--text); cursor: pointer; }
  .tog { position: relative; width: 38px; height: 21px; }
  .tog input { opacity: 0; width: 0; height: 0; }
  .tog-sl {
    position: absolute; inset: 0; background: var(--border);
    border-radius: 21px; transition: background .2s; cursor: pointer;
  }
  .tog-sl::before {
    content: ''; position: absolute; width: 15px; height: 15px;
    border-radius: 50%; background: #fff; top: 3px; left: 3px; transition: transform .2s;
  }
  .tog input:checked + .tog-sl { background: var(--accent); }
  .tog input:checked + .tog-sl::before { transform: translateX(17px); }
  .section-sep { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 18px 0 12px; }
  .btn-main {
    width: 100%; margin-top: 20px; padding: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; border-radius: 9px; color: #fff;
    font-size: .93rem; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    transition: opacity .2s;
  }
  .btn-main:disabled { opacity: .38; cursor: not-allowed; }
  .btn-main:not(:disabled):hover { opacity: .88; }
  .prog { margin-top: 12px; display: none; }
  .prog.on { display: block; }
  .prog-bg { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .prog-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 2px; width: 0; transition: width .3s; }
  .prog-lbl { font-size: .75rem; color: var(--muted); margin-top: 5px; }
  .err {
    background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.3);
    border-radius: 8px; padding: 10px 14px; font-size: .83rem; color: var(--danger);
    margin-top: 12px; display: none;
  }
  .err.on { display: block; }
  .result { display: none; flex-direction: column; gap: 14px; }
  .result.on { display: flex; }
  .res-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .res-head h2 { font-size: .97rem; font-weight: 600; }
  .badge { font-size: .73rem; padding: 3px 9px; border-radius: 20px; font-weight: 600; }
  .badge.g { background: rgba(52,211,153,.14); color: var(--success); }
  .badge.b { background: rgba(248,113,113,.14); color: var(--danger); }
  .prev-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media(max-width:480px){ .prev-grid { grid-template-columns: 1fr; } }
  .prev-box { background: var(--bg); border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
  .prev-lbl { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 7px 11px; border-bottom: 1px solid var(--border); }
  .prev-inner {
    padding: 14px; display: flex; align-items: center; justify-content: center; min-height: 130px;
    background: repeating-conic-gradient(#2a2a32 0% 25%, #1a1a1f 0% 50%) 0 0 / 14px 14px;
  }
  .prev-inner img, .prev-inner svg { max-width: 100%; max-height: 150px; object-fit: contain; }
  .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 9px; }
  .stat { background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 9px 11px; text-align: center; }
  .stat-v { font-size: 1.05rem; font-weight: 700; color: var(--accent2); }
  .stat-k { font-size: .67rem; color: var(--muted); margin-top: 1px; text-transform: uppercase; letter-spacing: .05em; }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn-sec {
    padding: 11px; background: var(--bg); border: 1px solid var(--accent);
    border-radius: 9px; color: var(--accent2); font-size: .87rem; font-weight: 600;
    cursor: pointer; transition: background .2s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none;
  }
  .btn-sec:hover { background: rgba(124,110,247,.1); }
  .copied { border-color: var(--success) !important; color: var(--success) !important; }
  canvas { display: none; }
</style>
</head>
<body>

<header>
  <h1>PNG → SVG</h1>
  <p>Traçado vetorial real · sem base64</p>
</header>

<div class="card">
  <div class="dropzone" id="dz">
    <input type="file" id="fi" accept="image/*" />
    <p style="margin-bottom:8px">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent2);display:block;margin:0 auto 10px">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <strong>Clica ou arrasta</strong> uma imagem
    </p>
    <p style="font-size:.76rem">PNG · JPG · WebP</p>
  </div>

  <div class="section-sep">Traçado</div>
  <div class="grid2">
    <div>
      <label class="lbl">Threshold</label>
      <div class="row"><input type="range" id="thr" min="1" max="254" value="128"><span class="val" id="thrV">128</span></div>
    </div>
    <div>
      <label class="lbl">Simplificação</label>
      <div class="row"><input type="range" id="simp" min="0" max="40" value="6"><span class="val" id="simpV">0.6</span></div>
    </div>
    <div>
      <label class="lbl">Área mínima (px²)</label>
      <div class="row"><input type="range" id="mina" min="1" max="2000" value="30"><span class="val" id="minaV">30</span></div>
    </div>
    <div>
      <label class="lbl">Limite de tamanho</label>
      <div class="row"><input type="range" id="maxs" min="128" max="1024" value="512" step="64"><span class="val" id="maxsV">512</span></div>
    </div>
  </div>

  <div class="section-sep">Cores</div>
  <div class="color-row">
    <div>
      <label class="lbl">Traço</label>
      <div class="cpick"><input type="color" id="cFill" value="#000000"><span id="cFillT">#000000</span></div>
    </div>
    <div id="bgWrap">
      <label class="lbl">Fundo</label>
      <div class="cpick"><input type="color" id="cBg" value="#ffffff"><span id="cBgT">#ffffff</span></div>
    </div>
  </div>

  <div class="toggle-row">
    <label for="transp">Fundo transparente</label>
    <label class="tog">
      <input type="checkbox" id="transp">
      <span class="tog-sl"></span>
    </label>
  </div>

  <div class="err" id="errMsg"></div>

  <button class="btn-main" id="convBtn" disabled>
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    Converter para SVG
  </button>

  <div class="prog" id="prog">
    <div class="prog-bg"><div class="prog-fill" id="progFill"></div></div>
    <div class="prog-lbl" id="progLbl">…</div>
  </div>
</div>

<div class="card result" id="result">
  <div class="res-head">
    <h2>Resultado</h2>
    <span class="badge" id="badge"></span>
  </div>

  <div class="prev-grid">
    <div class="prev-box">
      <div class="prev-lbl">Original</div>
      <div class="prev-inner"><img id="prevOrig" alt="" /></div>
    </div>
    <div class="prev-box">
      <div class="prev-lbl">SVG gerado</div>
      <div class="prev-inner" id="prevSvg"></div>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-v" id="sPng">—</div><div class="stat-k">PNG</div></div>
    <div class="stat"><div class="stat-v" id="sSvg">—</div><div class="stat-k">SVG</div></div>
    <div class="stat"><div class="stat-v" id="sPaths">—</div><div class="stat-k">Contours</div></div>
  </div>

  <div class="btn-row">
    <button class="btn-sec" id="copyBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      Copiar SVG
    </button>
    <a class="btn-sec" id="dlBtn" href="#" download="output.svg">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Baixar SVG
    </a>
  </div>
</div>

<canvas id="cv"></canvas>

<script>
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt = b => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : (b / 1048576).toFixed(2) + ' MB';

[
  ['thr','thrV', v => v],
  ['simp','simpV', v => (v / 10).toFixed(1)],
  ['mina','minaV', v => v],
  ['maxs','maxsV', v => v],
].forEach(([id, oid, fn]) => {
  const el = $(id), out = $(oid);
  out.textContent = fn(el.value);
  el.addEventListener('input', () => out.textContent = fn(el.value));
});

$('cFill').addEventListener('input', function() { $('cFillT').textContent = this.value; });
$('cBg').addEventListener('input', function() { $('cBgT').textContent = this.value; });
$('transp').addEventListener('change', function() {
  $('bgWrap').style.opacity = this.checked ? 0.4 : 1;
});

let file = null;
const dz = $('dz');

dz.addEventListener('dragover', e => {
  e.preventDefault();
  dz.classList.add('over');
});
dz.addEventListener('dragleave', () => dz.classList.remove('over'));
dz.addEventListener('drop', e => {
  e.preventDefault();
  dz.classList.remove('over');
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) setFile(f);
});
$('fi').addEventListener('change', () => {
  if ($('fi').files[0]) setFile($('fi').files[0]);
});

function setFile(f) {
  file = f;
  $('convBtn').disabled = false;
  $('errMsg').classList.remove('on');
  const r = new FileReader();
  r.onload = e => $('prevOrig').src = e.target.result;
  r.readAsDataURL(f);
  dz.querySelector('p').innerHTML = `<strong>${f.name}</strong>`;
}

function setP(pct, lbl) {
  $('prog').classList.add('on');
  $('progFill').style.width = pct + '%';
  $('progLbl').textContent = lbl;
}

function binarize(data, w, h, thr) {
  const bin = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) {
    const p = i * 4;
    const a = data[p + 3];
    if (a < 16) {
      bin[i] = 0;
      continue;
    }
    const L = 0.299 * data[p] + 0.587 * data[p + 1] + 0.114 * data[p + 2];
    bin[i] = L < thr ? 1 : 0;
  }
  return bin;
}

function edgesFromBinary(bin, w, h) {
  const edges = [];
  const add = (x1, y1, x2, y2) => edges.push([x1, y1, x2, y2]);

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (!bin[y * w + x]) continue;

      if (y === 0 || !bin[(y - 1) * w + x]) add(x, y, x + 1, y);
      if (x === w - 1 || !bin[y * w + x + 1]) add(x + 1, y, x + 1, y + 1);
      if (y === h - 1 || !bin[(y + 1) * w + x]) add(x + 1, y + 1, x, y + 1);
      if (x === 0 || !bin[y * w + x - 1]) add(x, y + 1, x, y);
    }
  }

  return edges;
}

function vkey(x, y) {
  return `${x},${y}`;
}

function ekey(a, b) {
  const A = vkey(a[0], a[1]);
  const B = vkey(b[0], b[1]);
  return A < B ? `${A}|${B}` : `${B}|${A}`;
}

function traceLoops(edges) {
  if (!edges.length) return [];

  const adj = new Map();
  const used = new Set();

  const addAdj = (a, b) => {
    const k = vkey(a[0], a[1]);
    if (!adj.has(k)) adj.set(k, []);
    adj.get(k).push(b);
  };

  for (const [x1, y1, x2, y2] of edges) {
    const a = [x1, y1], b = [x2, y2];
    addAdj(a, b);
    addAdj(b, a);
  }

  const contours = [];

  for (const [x1, y1, x2, y2] of edges) {
    const start = [x1, y1];
    const next = [x2, y2];
    const k0 = ekey(start, next);
    if (used.has(k0)) continue;
    used.add(k0);

    const loop = [start, next];
    let prev = start;
    let curr = next;

    for (let guard = 0; guard < edges.length + 8; guard++) {
      const list = adj.get(vkey(curr[0], curr[1])) || [];
      let found = null;

      for (const nb of list) {
        if (nb[0] === prev[0] && nb[1] === prev[1]) continue;
        const ek = ekey(curr, nb);
        if (!used.has(ek)) {
          found = nb;
          used.add(ek);
          break;
        }
      }

      if (!found) break;

      prev = curr;
      curr = found;
      loop.push(curr);

      if (curr[0] === start[0] && curr[1] === start[1]) break;
    }

    if (loop.length >= 4) contours.push(loop);
  }

  return contours;
}

function removeDuplicateEnd(pts) {
  if (pts.length > 1) {
    const a = pts[0], b = pts[pts.length - 1];
    if (a[0] === b[0] && a[1] === b[1]) return pts.slice(0, -1);
  }
  return pts;
}

function removeCollinear(pts) {
  pts = removeDuplicateEnd(pts);
  if (pts.length < 4) return pts;

  const out = [];
  const n = pts.length;

  for (let i = 0; i < n; i++) {
    const a = pts[(i - 1 + n) % n];
    const b = pts[i];
    const c = pts[(i + 1) % n];
    const cross = (b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]);
    if (Math.abs(cross) > 1e-9) out.push(b);
  }

  return out.length >= 3 ? out : pts;
}

function area(pts) {
  pts = removeDuplicateEnd(pts);
  let a = 0;
  for (let i = 0, n = pts.length; i < n; i++) {
    const j = (i + 1) % n;
    a += pts[i][0] * pts[j][1] - pts[j][0] * pts[i][1];
  }
  return Math.abs(a) / 2;
}

function toPath(pts) {
  pts = removeDuplicateEnd(pts);
  if (pts.length < 3) return '';
  const first = pts[0];
  const parts = [`M${Math.round(first[0])} ${Math.round(first[1])}`];
  for (let i = 1; i < pts.length; i++) {
    parts.push(`L${Math.round(pts[i][0])} ${Math.round(pts[i][1])}`);
  }
  parts.push('Z');
  return parts.join('');
}

function buildSVG(contours, w, h, fill, bg, transp) {
  const bgRect = transp ? '' : `<rect width="${w}" height="${h}" fill="${bg}"/>`;
  const d = contours.map(toPath).filter(Boolean).join(' ');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" preserveAspectRatio="xMidYMid meet">${bgRect}<path d="${d}" fill="${fill}" fill-rule="evenodd"/></svg>`;
}

let svgOut = '';
let dlURL = null;

$('convBtn').addEventListener('click', async () => {
  if (!file) return;
  $('convBtn').disabled = true;
  $('result').classList.remove('on');
  $('errMsg').classList.remove('on');

  try {
    setP(5, 'Carregando…');
    await sleep(20);

    const img = new Image();
    const ou = URL.createObjectURL(file);
    await new Promise((res, rej) => {
      img.onload = res;
      img.onerror = rej;
      img.src = ou;
    });
    URL.revokeObjectURL(ou);

    const MAX = +$('maxs').value;
    let w = img.naturalWidth;
    let h = img.naturalHeight;
    if (w > MAX || h > MAX) {
      const s = Math.min(MAX / w, MAX / h);
      w = Math.round(w * s);
      h = Math.round(h * s);
    }

    const cv = $('cv');
    cv.width = w;
    cv.height = h;
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    ctx.clearRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);

    const imgData = ctx.getImageData(0, 0, w, h);

    setP(20, 'Binarizando…');
    await sleep(15);
    const thr = +$('thr').value;
    const bin = binarize(imgData.data, w, h, thr);

    setP(40, 'Extraindo bordas…');
    await sleep(15);
    const edges = edgesFromBinary(bin, w, h);

    setP(60, 'Conectando contornos…');
    await sleep(15);
    const raw = traceLoops(edges);

    setP(75, 'Filtrando…');
    await sleep(15);
    const minA = +$('mina').value;
    const contours = raw
      .map(c => removeCollinear(c))
      .filter(c => c.length >= 3 && area(c) >= minA);

    if (!contours.length) {
      throw new Error('Nenhum contorno encontrado. Baixa o threshold ou usa uma imagem com mais contraste.');
    }

    setP(88, 'Gerando SVG…');
    await sleep(15);

    const fill = $('cFill').value;
    const bg = $('cBg').value;
    const transp = $('transp').checked;

    svgOut = buildSVG(contours, w, h, fill, bg, transp);

    setP(100, 'Pronto!');
    await sleep(50);

    const svgB = new TextEncoder().encode(svgOut).length;
    $('sPng').textContent = fmt(file.size);
    $('sSvg').textContent = fmt(svgB);
    $('sPaths').textContent = contours.length;

    const ratio = Math.round(svgB / file.size * 100);
    const badge = $('badge');
    badge.textContent = ratio + '% do PNG';
    badge.className = 'badge ' + (ratio < 100 ? 'g' : 'b');

    $('prevSvg').innerHTML = '';
    const parser = new DOMParser();
    const svgEl = parser.parseFromString(svgOut, 'image/svg+xml').documentElement;
    svgEl.style.cssText = 'max-width:100%;max-height:150px;';
    $('prevSvg').appendChild(svgEl);

    if (dlURL) URL.revokeObjectURL(dlURL);
    dlURL = URL.createObjectURL(new Blob([svgOut], { type: 'image/svg+xml' }));
    $('dlBtn').href = dlURL;
    $('dlBtn').download = (file.name.replace(/\.[^.]+$/, '') || 'output') + '.svg';

    $('result').classList.add('on');
  } catch (e) {
    $('errMsg').textContent = 'Erro: ' + e.message;
    $('errMsg').classList.add('on');
    console.error(e);
  } finally {
    $('convBtn').disabled = false;
  }
});

$('copyBtn').addEventListener('click', async () => {
  if (!svgOut) return;
  try {
    await navigator.clipboard.writeText(svgOut);
    const btn = $('copyBtn');
    btn.classList.add('copied');
    btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Copiado!`;
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copiar SVG`;
    }, 2500);
  } catch {
    alert('Não foi possível copiar. Tente baixar o SVG.');
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logo Pixelizado – Tamanho adequado</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
    canvas { display: block; position: fixed; inset: 0; }
  </style>
</head>
<body>
  <canvas id="pixelCanvas"></canvas>

  <script>
    (function() {
      const canvas = document.getElementById('pixelCanvas');
      const ctx = canvas.getContext('2d');

      // Configuração da grade
      const CELL_SIZE = 6;
      const DOT_RADIUS = 1.8;
      const IMAGE_SRC = 'logo_1.png';

      let imageData = null;
      let imgWidth = 0;
      let imgHeight = 0;
      let imageLoaded = false;

      function loadImage() {
        const img = new Image();
        img.src = IMAGE_SRC;
        img.onload = function() {
          resizeImage(img);
          imageLoaded = true;
          redraw();
        };
        img.onerror = function() {
          console.error('Imagem logo_1.png não encontrada.');
        };
      }

      function resizeImage(img) {
        // 90% da menor dimensão da janela (altura ou largura)
        const maxSize = Math.min(window.innerWidth, window.innerHeight) * 0.9;
        const scale = Math.min(maxSize / img.width, maxSize / img.height, 1);
        imgWidth = Math.floor(img.width * scale);
        imgHeight = Math.floor(img.height * scale);

        const offCanvas = document.createElement('canvas');
        offCanvas.width = imgWidth;
        offCanvas.height = imgHeight;
        const offCtx = offCanvas.getContext('2d');
        offCtx.drawImage(img, 0, 0, imgWidth, imgHeight);
        imageData = offCtx.getImageData(0, 0, imgWidth, imgHeight).data;
      }

      function redraw() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!imageLoaded) return;

        const offsetX = Math.floor((canvas.width - imgWidth) / 2);
        const offsetY = Math.floor((canvas.height - imgHeight) / 2);

        for (let y = 0; y < imgHeight; y += CELL_SIZE) {
          for (let x = 0; x < imgWidth; x += CELL_SIZE) {
            const idx = (Math.floor(y) * imgWidth + Math.floor(x)) * 4;
            const r = imageData[idx];
            const g = imageData[idx + 1];
            const b = imageData[idx + 2];
            const a = imageData[idx + 3] / 255;

            if (a > 0.02) {
              ctx.beginPath();
              ctx.arc(offsetX + x, offsetY + y, DOT_RADIUS, 0, Math.PI * 2);
              ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${a})`;
              ctx.fill();
            }
          }
        }
      }

      loadImage();
      window.addEventListener('resize', () => {
        if (imageLoaded) {
          // Recarrega a imagem com o novo tamanho da janela
          const img = new Image();
          img.src = IMAGE_SRC;
          img.onload = function() {
            resizeImage(img);
            redraw();
          };
        }
      });
    })();
  </script>
</body>
</html>
